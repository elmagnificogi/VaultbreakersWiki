name: Release web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack the viewable site
        id: pack
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/maps site/icons
          cp "龙窟破坏者WIKI.html" "site/龙窟破坏者WIKI.html"
          cp maps/pinewood.png maps/refinery.png maps/dragonvault.png site/maps/
          find icons -maxdepth 1 -type f -iname '*.png' -exec cp -t site/icons {} +
          cat > site/README.md << 'EOF'
          解压后用浏览器打开 龙窟破坏者WIKI.html。

          这个压缩包只有页面、图标和三张小地图。
          EOF
          python3 - << 'PY'
          import os
          allowed_ext = {".html", ".md", ".png"}
          bad = []
          for root, dirs, files in os.walk("site"):
              for name in files:
                  path = os.path.join(root, name)
                  ext = os.path.splitext(name)[1].lower()
                  if ext not in allowed_ext:
                      bad.append(path)
          if bad:
              raise SystemExit("refusing to pack: " + ", ".join(bad))
          required = [
              "site/龙窟破坏者WIKI.html",
              "site/maps/pinewood.png",
              "site/maps/refinery.png",
              "site/maps/dragonvault.png",
          ]
          missing = [path for path in required if not os.path.isfile(path)]
          icons = [name for name in os.listdir("site/icons") if name.lower().endswith(".png")]
          if missing or not icons:
              raise SystemExit(f"site pack incomplete: missing={missing} icons={len(icons)}")
          print(f"packed icons {len(icons)}")
          PY
          version=$(grep -oE '版本 v[0-9]+(\.[0-9]+)+' "龙窟破坏者WIKI.html" | head -n 1 | awk '{print $2}')
          if [ -z "$version" ]; then
            echo "page version missing from 龙窟破坏者WIKI.html" >&2
            exit 1
          fi
          stamp=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)
          archive="Vaultbreakers-loot-wiki-${version}-${stamp}.zip"
          (cd site && zip -qr "../${archive}" .)
          if unzip -l "$archive" | grep -Ei '\.(js|cs|dll|exe)$|EXTRACT\.md|package\.json|dump\.cs|Il2Cpp|node_modules'; then
            echo "zip contains files that are not part of the static site" >&2
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Point the release at the static site only
        id: site
        run: |
          set -euo pipefail
          index=$(mktemp)
          rm -f "$index"
          export GIT_AUTHOR_NAME="$(git log -1 --format='%an')"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format='%ae')"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          GIT_INDEX_FILE="$index" git --work-tree=site add --all
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          rm -f "$index"
          commit=$(git commit-tree "$tree" -m "静态网页")
          git push origin "$commit:refs/tags/web-${GITHUB_SHA}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Name the release
        id: rel
        run: echo "name=网页 ${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.sha }}
          target_commitish: ${{ steps.site.outputs.commit }}
          name: ${{ steps.rel.outputs.name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.pack.outputs.archive }}
          body: |
            解压后用浏览器打开 龙窟破坏者WIKI.html，不需要安装游戏。
            压缩包只有页面、图标和三张小地图。
